[project]
name = "alien-invasion"
version = "0.2.0"
description = "Jogo arcade de defesa espacial feito com Pygame"
readme = "README.md"
authors = [
    { name = "andreluoliveira82", email = "andreluoliveira@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6.1",
]

[project.scripts]
alien-invasion = "alien_invasion:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
